name: Apply audited frontend lock

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-audited-frontend-lock
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.head_commit.message != 'fix: update audited frontend lock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate and validate lockfile
        working-directory: frontend
        run: |
          npm ci
          npm audit fix --package-lock-only
          npm ci
          npm run build
          npm audit --audit-level=high
      - name: Commit validated lockfile
        run: |
          git config user.name "Mrgu2"
          git config user.email "86710948+Mrgu2@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes produced"
          else
            git commit -m "fix: update audited frontend lock"
            git push origin HEAD:main
          fi
