name: Frontend lock repair preview

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-lock-repair-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate safe npm audit lockfile repair
        working-directory: frontend
        run: |
          npm ci
          npm audit fix --package-lock-only
          npm audit --audit-level=high
      - name: Show package lock diff
        run: git diff -- frontend/package-lock.json
