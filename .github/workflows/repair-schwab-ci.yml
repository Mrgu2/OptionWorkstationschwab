name: Frontend override compatibility preview

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-override-compatibility-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test overrides against the committed lockfile
        working-directory: frontend
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.overrides = {
            ...(pkg.overrides || {}),
            browserslist: '4.28.9',
            'baseline-browser-mapping': '2.11.21'
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE
          npm ci
          npm audit --audit-level=high
      - name: Show resulting diffs
        run: git diff -- frontend/package.json frontend/package-lock.json
