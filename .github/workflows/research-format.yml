name: Research Branch Autoformat

on:
  push:
    branches: [research-lab-v1]

permissions:
  contents: write

concurrency:
  group: research-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research-lab-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --manifest-path rust-backend/Cargo.toml --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-backend/src
          git commit -m "style: rustfmt walk-forward research"
          git push origin HEAD:research-lab-v1
